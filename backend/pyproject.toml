[project]
name = "fraudlens"
version = "0.1.0"
description = "FraudLens AI - agentic fraud detection, investigation and response (hackathon MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "google-genai==2.31.0",
    "google-adk==2.12.0",
    "google-cloud-firestore==2.34.1",
    "google-cloud-storage==3.17.1",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "networkx==3.7",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "google-auth==2.62.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
